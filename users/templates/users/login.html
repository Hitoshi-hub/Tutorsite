{% extends 'base.html' %}

{% block content %}
<section class="section">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="form-shell">
                <h2 class="mb-2">Вход в систему</h2>
                <p class="text-muted">Доступ к расписанию, чатам и отзывам.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn-primary w-100">Войти</button>
                </form>
                <div class="text-muted mt-3">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
