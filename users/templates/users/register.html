{% extends 'base.html' %}

{% block content %}
<section class="section">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="form-shell">
                <h2 class="mb-2">Регистрация ученика</h2>
                <p class="text-muted">Создайте профиль и начинайте учиться.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn-primary w-100">Создать аккаунт</button>
                </form>
                <div class="text-muted mt-3">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
