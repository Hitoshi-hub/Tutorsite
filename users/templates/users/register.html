{% extends 'base.html' %}

{% block content %}
   
    <div style="max-width: 400px; margin: 50px auto; font-family: sans-serif;">
        <h1>Регистрация ученика</h1>
        
        <form method="post">
            {% csrf_token %} {{ form.as_p }}
            <button type="submit" style="width: 100%; padding: 10px; background: #28a745; color: white; border: none; cursor: pointer;">
                Создать аккаунт
            </button>
        </form>
        
        <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти здесь</a></p>
    </div>
{% endblock %}
