<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorSite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"> <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">🎓 TutorSite</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="{% url 'tutor_list' %}">Найти репетитора</a>
                <a class="nav-link" href="{% url 'become_tutor' %}">Стать преподавателем</a>
            </div>
            <div class="navbar-nav ms-auto">
    {% if user.is_authenticated %}
        <span class="nav-item nav-link text-light me-3">Привет, {{ user.username }}!</span>
        <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger btn-sm">Выйти</button>
        </form>
    {% else %}
        <a class="nav-item nav-link" href="{% url 'login' %}">Вход</a>
        <a class="nav-item nav-link btn btn-primary text-white ms-lg-2" href="{% url 'register' %}">Регистрация</a>
    {% endif %}
</div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
