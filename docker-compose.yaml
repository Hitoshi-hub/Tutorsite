version: '3.8'

services:
  web:
    build: .
    volumes:
      - .:/app
      - tutor_media:/app/media
    ports:
      - "8000:8000"
#    env_file:
#     - .env # Если решишь вынести SECRET_KEY и DEBUG сюда
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  tutor_media: