version: '3.8'

services:
  web:
    build: .
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "change-me"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: ""
    volumes:
      - tutor_media:/app/media
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  tutor_media:
